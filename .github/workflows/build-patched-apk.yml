name: Build P40 release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Restore fixed release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ZORV_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > zorv-release.jks

      - name: Build signed full release APK
        env:
          ZORV_STORE_FILE: ../zorv-release.jks
          ZORV_STORE_PASSWORD: ${{ secrets.ZORV_KEYSTORE_PASSWORD }}
          ZORV_KEY_ALIAS: ${{ secrets.ZORV_KEY_ALIAS }}
          ZORV_KEY_PASSWORD: ${{ secrets.ZORV_KEY_PASSWORD }}
        run: gradle :app:assembleFullRelease --stacktrace --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ZorvAI-v1.16-p40.32-full-release
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 7
