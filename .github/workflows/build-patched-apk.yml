name: Build stable-signed patched Zorv AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v1.0.63-huawei-tools

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout full source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android and native build packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Restore stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZORV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ZORV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZORV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZORV_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > ci-keystore.p12
          printf '%s\n' \
            'storeFile=../ci-keystore.p12' \
            "storePassword=$STORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" > keystore.properties

      - name: Build stable-signed full release APK
        run: gradle :app:assembleFullRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZorvAI-v1.0.63-patched-20260825.3
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 14
